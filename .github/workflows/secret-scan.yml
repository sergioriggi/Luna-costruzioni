name: Scansione segreti

# gitleaks sui commit che ogni push o pull request aggiunge, con le regole di
# .gitleaks.toml (quelle predefinite di gitleaks più le nostre). Copiato dal
# repository sussex-project il 31 ottobre 2026, senza le regole Supabase che
# qui non servono. Vengono scansionati solo i commit nuovi, non tutta la
# storia: così un run è rosso solo per ciò che il push ha appena aggiunto.
# Un riscontro fa fallire il check; il valore è oscurato nel log (si vedono
# file, riga, regola e commit).
#
# Mai aggiungere un valore vero alla lista di esclusione di .gitleaks.toml:
# va tolto dal commit e la credenziale va rigenerata.

on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (commit nuovi)
    # La cancellazione di un ramo è un push con `after` tutto zeri: niente
    # da scansionare.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installa gitleaks (versione fissa, checksum verificato)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scansiona i commit nuovi
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$AFTER"
          elif [ "$REF_NAME" = "main" ]; then
            # Su main senza un `before` utilizzabile (primo push, o storia
            # riscritta) `origin/main..` sarebbe vuoto: si scansionano gli
            # ultimi 100 commit.
            RANGE="-100 $AFTER"
          else
            # Ramo nuovo, o force-push che ha riscritto la storia: si scansiona
            # ogni commit che non sta già su main.
            RANGE="origin/main..$AFTER"
          fi
          echo "Scansione di $RANGE: $(git rev-list --count $RANGE) commit"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml --log-opts="$RANGE" .
