# Controllo del sito PUBBLICATO: ogni 6 ore e a richiesta.
#
# `verifica.yml` controlla il codice a ogni push. Questo controlla il sito che
# risponde a un cliente: fra i due c'è la build di Hostinger con le sue
# variabili d'ambiente, che non stanno nel repository e che ci hanno già rotto
# il sito una volta. Fino al 31 ottobre 2026 partiva solo a mano e puntava
# ancora al dominio di anteprima di Hostinger: un sito rotto si sarebbe
# scoperto solo quando qualcuno avesse pensato di lanciarlo.
#
# Ora gira da solo ogni 6 ore sul dominio definitivo (www.lunacostruzioni.it,
# attivo dall'11 settembre 2026) e si può ancora lanciare con un tocco
# dall'app GitHub — Actions → «Controllo del sito pubblicato» → Run workflow —
# anche su un altro indirizzo (per esempio l'anteprima di Hostinger).
#
# Solo letture GET: non tocca il modulo contatti e non invia nulla.
# Se è rosso, GitHub avvisa per email chi ha fatto l'ultimo commit a questo
# file; il primo passo è il log del run (riepilogo a fondo pagina) e poi hPanel
# → sito Luna → log della build e variabili d'ambiente (elenco nel README).
#
# Nessun `npm ci`: lo script non ha dipendenze (vedi la sua intestazione),
# quindi il controllo finisce in pochi secondi e non c'è un'installazione che
# possa fallire e far sembrare rotto il sito.
name: Controllo del sito pubblicato

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      indirizzo:
        description: Indirizzo da controllare (vuoto = il dominio definitivo)
        required: false
        default: https://www.lunacostruzioni.it

permissions:
  contents: read

concurrency:
  group: controllo-online
  cancel-in-progress: true

jobs:
  online:
    name: Interroga il sito
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Controlla il sito
        run: node scripts/verifica-online.mjs "${{ inputs.indirizzo || 'https://www.lunacostruzioni.it' }}"
