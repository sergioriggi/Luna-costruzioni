# Compila il sito e pubblica il risultato nella radice di `main`.
#
# L'hosting (Hostinger) è collegato a GitHub, pubblica il ramo `main` e copia
# i file così come sono: non esegue `npm run build`. Per questo il sito
# compilato viene committato nella radice del repository, accanto al codice
# sorgente. `public/.htaccess` — che diventa il .htaccess della radice —
# rende irraggiungibili dal web sorgente e materiali non pubblicabili.
#
# Il modello HTML di Vite si chiama `sorgente.html` proprio per non essere
# sovrascritto dalla home compilata.
name: Compila e pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblicazione
  cancel-in-progress: false

jobs:
  pubblica:
    name: Compila, verifica e pubblica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compila
        env:
          # Il sito è servito dalla radice del dominio
          VITE_BASE: /
          # Indirizzo pubblico da cui il sito è realmente servito.
          # Oggi è l'hosting provvisorio; quando il dominio definitivo sarà
          # attivo basta creare la variabile VITE_SITE_URL nelle impostazioni
          # del repository (Settings → Secrets and variables → Actions):
          # ha la precedenza su questo valore di ripiego e riapre
          # l'indicizzazione da sé.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://salmon-camel-544200.hostingersite.com' }}
          VITE_ENDPOINT_LEAD: ${{ vars.VITE_ENDPOINT_LEAD }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
        run: npm run build

      # Blocca la pubblicazione se il sito viola le direttive Rocks Design
      - name: Verifica di conformità
        run: npm run verifica

      - name: Controlla che il risultato sia completo
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/sitemap.xml
          test -d dist/media
          ! test -f dist/sorgente.html
          grep -q "media-sources" dist/.htaccess
          echo "Pagine compilate: $(find dist -name index.html | wc -l)"

      - name: Porta il sito compilato nella radice
        run: |
          # Si cancella solo ciò che la pubblicazione precedente aveva messo,
          # elencato in .sito-pubblicato: il codice sorgente non viene toccato
          # da nessuna euristica.
          if [ -f .sito-pubblicato ]; then
            while IFS= read -r voce; do
              [ -n "$voce" ] && rm -rf -- "$voce"
            done < .sito-pubblicato
          fi

          cp -a dist/. .

          # Nuovo elenco di ciò che appartiene al sito pubblicato
          (cd dist && find . -mindepth 1 -maxdepth 1 -printf '%P\n') | sort > .sito-pubblicato

          rm -rf dist dist-ssr
          echo "Voci pubblicate nella radice:"
          cat .sito-pubblicato

      - name: Pubblica
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica al sito compilato."
            exit 0
          fi
          git commit -q -m "Sito compilato da ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main
          echo "Sito aggiornato nella radice di main."
